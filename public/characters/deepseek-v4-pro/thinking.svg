    <path d="M 355 135 C 340 65, 415 55, 405 95 C 398 118, 370 115, 372 132" fill="none" stroke="#1E40AF" stroke-width="12" stroke-linecap="round"/><circle cx="373" cy="145" r="6" fill="#60A5FA"/>

    <!-- Facial Expression -->
    
      <!-- Confused asymmetrical eyebrows -->
