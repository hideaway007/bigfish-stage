      <!-- Wavy confused mouth -->
      <path d="M 340 364 Q 350 354 360 364 Q 370 374 380 364" fill="none" stroke="#0A0A0C" stroke-width="5" stroke-linecap="round"/>
    

    <!-- Emotion-Specific Foreground Props -->
    
      <!-- Left Hand Sign: MAX -->
      <g transform="translate(55, 360) rotate(-14)">
