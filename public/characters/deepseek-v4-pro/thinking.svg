      <circle cx="308" cy="308" r="6" fill="#0A0A0C"/>
      <circle cx="302" cy="300" r="5" fill="#FFFFFF"/>

      <ellipse cx="416" cy="308" rx="24" ry="26" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="5"/>
      <circle cx="412" cy="308" r="14" fill="#2563EB"/>
      <circle cx="412" cy="308" r="6" fill="#0A0A0C"/>
      <circle cx="406" cy="300" r="5" fill="#FFFFFF"/>
