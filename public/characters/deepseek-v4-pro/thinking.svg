        <text x="80" y="68" font-family="Impact, Anton, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle" stroke="#0A0A0C" stroke-width="3">LOW</text>
        <text x="80" y="100" font-family="sans-serif" font-size="18" font-weight="900" fill="#93C5FD" text-anchor="middle">思考强度</text>
      </g>
      <!-- Question marks above head -->
