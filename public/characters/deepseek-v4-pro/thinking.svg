    <text x="415" y="64" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">思考 · MAX / LOW?</text>
    <text x="415" y="90" font-family="monospace" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle">DEEPSEEK · V4 PRO // 大肥鱼</text>
