    <path d="M 430 630 C 555 600, 640 500, 615 370 C 655 345, 695 305, 690 250 C 640 265, 600 300, 580 335 C 550 305, 500 285, 460 290 C 485 335, 525 360, 555 375 C 545 480, 485 545, 410 575 Z" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
