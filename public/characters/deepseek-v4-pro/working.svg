    <polygon points="14,30 622,12 608,98 26,106" fill="#E60012"/>
    <polygon points="14,30 225,24 208,101 26,106" fill="#E60012"/>
    <text x="118" y="78" font-family="Impact, Anton, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">WORKING</text>
    <text x="415" y="64" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">行动 · 挥舞 HARNESS!</text>
    <text x="415" y="90" font-family="monospace" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle">DEEPSEEK · V4 PRO // 大肥鱼</text>
