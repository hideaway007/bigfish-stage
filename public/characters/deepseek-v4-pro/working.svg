        <polygon points="-145,-34 230,-24 295,0 230,24 -145,34" fill="#0F172A" stroke="#0A0A0C" stroke-width="5"/>
        <polygon points="-130,4 210,4 250,18 -130,24" fill="#FFFFFF"/>
        <!-- Orca Tail Flukes at tip -->
