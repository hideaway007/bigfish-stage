      <ellipse cx="304" cy="312" rx="18" ry="19" fill="#1D4ED8"/>
      <polygon points="304,292 310,308 326,312 310,316 304,332 298,316 282,312 298,308" fill="#93C5FD"/>
      <circle cx="296" cy="300" r="6" fill="#FFFFFF"/>

      <ellipse cx="416" cy="310" rx="23" ry="24" fill="#0A0A0C"/>
      <ellipse cx="416" cy="312" rx="18" ry="19" fill="#1D4ED8"/>
      <polygon points="416,292 422,308 438,312 422,316 416,332 410,316 394,312 410,308" fill="#93C5FD"/>
      <circle cx="408" cy="300" r="6" fill="#FFFFFF"/>
