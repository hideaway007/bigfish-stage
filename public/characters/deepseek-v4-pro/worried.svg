        <polygon points="-20,-15 170,25 0,30" fill="#F59E0B" stroke="#0A0A0C" stroke-width="6"/>
        <polygon points="365,-25 170,25 340,20" fill="#F59E0B" stroke="#0A0A0C" stroke-width="6"/>
        <rect x="45" y="65" width="250" height="58" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="5" transform="rotate(-2 170 95)"/>
        <text x="170" y="104" font-family="sans-serif" font-size="30" font-weight="900" fill="#E60012" text-anchor="middle">先抱纸箱跑路捏!</text>
        <text x="170" y="165" font-family="monospace" font-size="22" font-weight="900" fill="#451A03" text-anchor="middle">FRAGILE // DEEPSEEK</text>
