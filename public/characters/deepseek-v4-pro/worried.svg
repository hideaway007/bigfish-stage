      <ellipse cx="416" cy="310" rx="25" ry="28" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="5.5"/>
      <circle cx="416" cy="312" r="9" fill="#1D4ED8"/>
      <circle cx="416" cy="312" r="4" fill="#0A0A0C"/>
      <!-- Sweat drops -->
      <path d="M 465 265 C 455 285, 455 300, 465 305 C 475 300, 475 285, 465 265 Z" fill="#38BDF8" stroke="#0A0A0C" stroke-width="4"/>
      <path d="M 248 285 C 240 302, 240 314, 248 318 C 256 314, 256 302, 248 285 Z" fill="#38BDF8" stroke="#0A0A0C" stroke-width="4"/>
      <!-- Wobbly panicked mouth -->
      <path d="M 334 372 Q 347 352 360 368 Q 373 352 386 372 Z" fill="#F43F5E" stroke="#0A0A0C" stroke-width="5"/>
    

    <!-- Emotion-Specific Foreground Props -->
    
      <!-- Pack Box & Run (抱起纸箱跑路) -->
      <g transform="translate(190, 495) rotate(4)">
        <polygon points="0,30 340,20 330,210 10,215" fill="#D97706" stroke="#FFFFFF" stroke-width="10"/>
