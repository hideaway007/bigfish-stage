  <polygon points="80,220 655,160 620,250 65,300" fill="#10B981" opacity="0.85"/>

  <g transform="">
    <!-- Big Whale Tail Behind Body -->
    <path d="M 430 610 C 560 560, 650 430, 620 300 C 660 270, 700 220, 690 170 C 640 190, 600 230, 585 265 C 555 230, 505 205, 465 205 C 485 255, 530 285, 560 305 C 555 420, 490 500, 410 545 Z" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 430 610 C 560 560, 650 430, 620 300 C 660 270, 700 220, 690 170 C 640 190, 600 230, 585 265 C 555 230, 505 205, 465 205 C 485 255, 530 285, 560 305 C 555 420, 490 500, 410 545 Z" fill="#1D4ED8" stroke="#0A0A0C" stroke-width="7" stroke-linejoin="round"/>
