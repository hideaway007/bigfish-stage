      <path d="M 392 266 Q 416 248 445 266" fill="none" stroke="#0A0A0C" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Happy curved ^ ^ eyes -->
      <path d="M 280 314 Q 304 282 328 314" fill="none" stroke="#0A0A0C" stroke-width="8" stroke-linecap="round"/>
      <path d="M 392 314 Q 416 282 440 314" fill="none" stroke="#0A0A0C" stroke-width="8" stroke-linecap="round"/>
      <!-- Rosy blush -->
      <ellipse cx="266" cy="338" rx="18" ry="9" fill="#FB7185" opacity="0.8"/>
      <ellipse cx="454" cy="338" rx="18" ry="9" fill="#FB7185" opacity="0.8"/>
      <!-- Big cheerful smile -->
      <path d="M 330 350 Q 360 398 390 350 Z" fill="#F43F5E" stroke="#0A0A0C" stroke-width="5"/>
      <path d="M 342 368 Q 360 384 378 368" fill="#FDA4AF"/>
    

    <!-- Emotion-Specific Foreground Props -->
    
      <!-- Steam Locomotive Speech Callout -->
      <g transform="translate(65, 95) rotate(-8)">
        <polygon points="0,10 205,0 195,90 120,90 140,125 85,90 -10,95" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="7"/>
        <rect x="14" y="16" width="170" height="28" fill="#E60012"/>
        <text x="98" y="37" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">STEAM LOCOMOTIVE</text>
        <text x="98" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#0A0A0C" text-anchor="middle">蒸汽机车叭叭叭!</text>
      </g>
      <!-- Sparkles -->
      <polygon points="555,140 567,170 597,182 567,194 555,224 543,194 513,182 543,170" fill="#FACC15" stroke="#0A0A0C" stroke-width="4"/>
      <polygon points="145,380 153,400 173,408 153,416 145,436 137,416 117,408 137,400" fill="#38BDF8" stroke="#0A0A0C" stroke-width="4"/>
    
  </g>

  <!-- Slanted Character & Emotion Stamp at Bottom -->
  <g transform="translate(36, 755) rotate(-3)">
    <polygon points="0,18 635,0 620,108 15,118" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="8"/>
    <polygon points="14,30 622,12 608,98 26,106" fill="#065F46"/>
