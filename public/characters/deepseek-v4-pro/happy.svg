    <path d="M 125 352 C 155 348, 190 335, 220 315" fill="none" stroke="#93C5FD" stroke-width="5" stroke-linecap="round"/>

    <path d="M 495 275 C 575 270, 615 320, 628 375 C 585 375, 535 355, 488 325 Z"
          fill="#2563EB" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 495 275 C 575 270, 615 320, 628 375 C 585 375, 535 355, 488 325 Z"
