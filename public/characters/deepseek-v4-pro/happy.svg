    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <circle cx="8" cy="8" r="3.5" fill="#10B981" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Slanted Backing Card / Comic Shadow -->
