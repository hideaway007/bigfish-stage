    <circle cx="468" cy="182" r="12" fill="#2563EB" stroke="#0A0A0C" stroke-width="4"/>

    <!-- Signature Ahoge (头顶呆毛) -->
    <path d="M 355 138 C 335 72, 415 68, 425 112 C 400 105, 378 115, 365 138 Z" fill="#2563EB" stroke="#0A0A0C" stroke-width="6"/>

    <!-- Facial Expression -->
    
      <!-- Happy curved eyebrows -->
