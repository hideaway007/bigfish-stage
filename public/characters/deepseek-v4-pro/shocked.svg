      <ellipse cx="416" cy="306" rx="27" ry="31" fill="#FFFFFF" stroke="#0A0A0C" stroke-width="6"/>
      <circle cx="416" cy="306" r="13" fill="none" stroke="#2563EB" stroke-width="4"/>
      <circle cx="416" cy="306" r="5" fill="#0A0A0C"/>
