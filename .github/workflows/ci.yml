name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
      - name: Validate character packs
        run: npm run check:characters
      - name: Typecheck frontend & server
        run: |
          npm run typecheck
          npm --prefix server run check
      - name: Run server & desktop runtime unit tests
        run: |
          npm --prefix server test
          npm run test:runtime
      - name: Build web bundle & native engine
        run: npm run build:all
      - name: Smoke check production server entry
        run: |
          node -e '
            const { spawn } = require("node:child_process");
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const tmp = fs.mkdtempSync(path.join(os.tmpdir(), "bigfish-ci-start-"));
            const proc = spawn(process.execPath, ["server/dist/index.js"], {
              env: {
                ...process.env,
                PORT: "0",
                BIGFISH_SETTINGS_PATH: path.join(tmp, "settings.json"),
              },
              stdio: ["ignore", "pipe", "pipe"],
            });
            let out = "";
            let done = false;
            const cleanup = () => fs.rmSync(tmp, { recursive: true, force: true });
            const fail = (msg) => {
              if (done) return;
              done = true;
              console.error(msg + "\n" + out);
              proc.kill("SIGKILL");
              cleanup();
              process.exit(1);
            };
            const timer = setTimeout(() => fail("Production server start timed out"), 15000);
            proc.stdout.on("data", async (chunk) => {
              out += chunk.toString("utf8");
              const m = out.match(/http:\/\/127\.0\.0\.1:(\d+)/);
              if (!m || done) return;
              done = true;
              clearTimeout(timer);
              try {
                const base = m[0];
                const health = await fetch(base + "/health").then((r) => r.json());
                const indexRes = await fetch(base + "/");
                if (!health.ok || indexRes.status !== 200) {
                  throw new Error("Unexpected /health or / status: " + indexRes.status);
                }
                proc.kill("SIGTERM");
                cleanup();
                process.exit(0);
              } catch (err) {
                done = false;
                fail(String(err));
              }
            });
            proc.stderr.on("data", (chunk) => {
              out += chunk.toString("utf8");
            });
            proc.on("exit", (code) => {
              if (!done && code && code !== 0) {
                fail("Server exited with code " + code);
              }
            });
          '
      - name: Verify unpacked desktop bundle layout (no sign / no release)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --linux dir --publish never
          node -e '
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const {
              verifyPackagedAppDir,
              resolveRuntimePaths,
              ensureBigfishProfile,
            } = require("./electron/runtime.cjs");
            const unpackedRoot = fs.readdirSync("output").find((d) => d.endsWith("-unpacked"));
            if (!unpackedRoot) {
              throw new Error("No *-unpacked directory found in output/");
            }
            const appDir = path.resolve("output", unpackedRoot, "resources", "app");
            verifyPackagedAppDir(appDir);
            const tmp = fs.mkdtempSync(path.join(os.tmpdir(), "bigfish-ci-pkg-"));
            try {
              const dshHome = path.join(tmp, ".dsh");
              const runtimePaths = resolveRuntimePaths({
                moduleDir: path.join(appDir, "electron"),
                isPackaged: true,
                resourcesPath: path.dirname(appDir),
                homeDir: tmp,
                env: { DSH_HOME: dshHome },
              });
              ensureBigfishProfile({
                appRoot: runtimePaths.appRoot,
                pluginDir: runtimePaths.pluginDir,
                dshHome,
                homeDir: tmp,
              });
            } finally {
              fs.rmSync(tmp, { recursive: true, force: true });
            }
            console.log("Verified packaged app directory:", appDir);
          '
